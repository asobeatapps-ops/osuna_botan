<body>
<div id="app"><div class="viewport" id="viewport">
  <section id="screenTitle" class="screen" aria-label="タイトル画面">
    <div class="office-art" id="titleOfficeArt" aria-hidden="true"></div><div class="title-shade"></div>
    <div class="title-content">
      <h1 class="game-title"><span>押すなって</span><em>言っただろ！</em></h1>

  </section>
  <section id="screenGame" class="screen phase-intro" aria-label="ゲーム画面" hidden>
    <div id="gameWorld" class="game-world">
      <div class="office-art" id="gameOfficeArt" aria-hidden="true"></div>
      <div class="world-overlay"></div><div class="desk-glint"></div>
      <div class="loose-paper one"></div><div class="loose-paper two"></div><div class="loose-paper three"></div>
    </div>

function beep(type='tap'){
  if(!soundOn)return;
  try{
    const Ctx=window.AudioContext||window.webkitAudioContext;if(!Ctx)return;
    if(!audio)audio=new Ctx();if(audio.state==='suspended')audio.resume().catch(()=>{});
    const t=audio.currentTime;
    const tone=(freq,length,shape='sine',vol=.06,offset=0,to=null)=>{const o=audio.createOscillator(),g=audio.createGain();o.type=shape;o.frequency.setValueAtTime(freq,t+offset);if(to)o.frequency.exponentialRampToValueAtTime(to,t+offset+length);g.gain.setValueAtTime(.001,t+offset);g.gain.exponentialRampToValueAtTime(vol,t+offset+.011);g.gain.exponentialRampToValueAtTime(.001,t+offset+length);o.connect(g);g.connect(audio.destination);o.start(t+offset);o.stop(t+offset+length+.015)};
    if(type==='start'){tone(280,.13,'triangle',.08);tone(440,.16,'triangle',.065,.1);tone(660,.23,'triangle',.06,.2)}
    else if(type==='chat'){tone(720,.055,'sine',.037);tone(940,.09,'sine',.018,.06)}
    else if(type==='tap'){tone(145,.13,'triangle',.14,0,88);tone(430,.045,'square',.035)}
    else if(type==='paper'){tone(560,.065,'triangle',.035);tone(770,.055,'sine',.024,.04)}
    else if(type==='exit'){tone(390,.1,'sine',.07);tone(460,.13,'sine',.05,.06)}
    else if(type==='hold'){tone(190,.17,'sawtooth',.06,0,105)}
    else if(type==='shake'){tone(110,.22,'sawtooth',.08,0,180)}
    else if(type==='tick'){tone(950,.05,'triangle',.08)}
    else if(type==='alarm'){tone(340,.31,'sawtooth',.085,0,148);tone(280,.32,'sawtooth',.065,.12,105)}
    else if(type==='end'){tone(420,.2,'triangle',.09);tone(620,.22,'triangle',.08,.14);tone(840,.35,'sine',.068,.28)}
    else if(type==='good'){tone(480,.12,'sine',.085);tone(640,.14,'sine',.08,.1);tone(810,.24,'sine',.075,.2);tone(1080,.3,'sine',.06,.36)}
  }catch{}
}

function advanceDialogue(){

function startPlaying(){

function renderTimer(){

  const remaining=Math.max(0,run.remainingMs);
  const seconds=Math.ceil(remaining/1000);
  const label=`00:${String(seconds).padStart(2,'0')}`;
  if($('timeText').textContent!==label){
    $('timeText').textContent=label;
    $('timerFill').style.background=seconds<=5?'#ff4964':seconds<=10?'#ffda78':'#80e6b4';
    $('timerCard').classList.toggle('warning',seconds<=10&&seconds>5);
    $('timerCard').classList.toggle('danger',seconds<=5);
  }
  $('timerFill').style.width=`${remaining/durationMs*100}%`;

function renderGame(){
  if(!run)return;

  $('pressText').textContent=run.presses;
  $('paperText').textContent=run.paperLeft;
  $('paperBtn').disabled=run.paperLeft===0;
  const n=run.presses;
  const stage=n===0?0:n===1?1:n<=3?2:n<=6?3:4;
  const world=$('gameWorld');
  for(let i=1;i<=4;i++)world.classList.toggle(`stage-${i}`,i===stage);
  $('sceneOfficeClock').textContent=n>=2&&n<=3?'09:00':n>=4?'??:??':'18:00';
}
function gameFrame(now){
  if(phase!=='playing'||!run?.active)return;
  const delta=Math.max(0,now-lastFrameTime);lastFrameTime=now;
  if(!document.hidden)run.remainingMs=Math.max(0,run.remainingMs-delta);
  if(run.held){
    const heldFor=now-run.holdStart;
    $('holdFill').style.width=`${Math.min(100,heldFor/3000*100)}%`;
    if(heldFor>=3000){$('redButton').classList.add('is-charged');$('buttonMessage').textContent='長押し完了！ 離してみよう';}
  }
  const prev=run.lastWholeSecond;
  const curr=Math.ceil(run.remainingMs/1000);
  if(curr!==prev){run.lastWholeSecond=curr;if(curr<=3&&curr>=1)beep('tick');}
  renderTimer();
  if(run.remainingMs<=0){onTimeout();return}
  loopId=requestAnimationFrame(gameFrame);

function chooseByPressCount(){
  const n=run?.presses||0;
  return n===0?'work':n===1?'once':n<=3?'monday':n<=6?'gravity':n<=9?'everyone':'earth';
}
function onTimeout(){
  if(phase!=='playing'||!run?.active)return;
  if(run.held&&performance.now()-run.holdStart>=3000){finish('ceo');return}
  if(run.presses===0){finish(run.actions===0?'idle':'work')}
  else if(run.presses===1&&run.paperLeft===0){finish('true')}
  else finish(chooseByPressCount());
}
function doPaper(){
  if(phase!=='playing'||!run?.active||run.held||run.paperLeft<=0)return;
  run.paperLeft--;run.actions++;beep('paper');renderGame();
  if(run.paperLeft===0){toast('書類、全部終わった！ ……たぶん。',false,1500);vibrate([20,50,30]);}
  else toast(`書類を1枚処理！　あと${run.paperLeft}枚`,false,1000);
}
function doExit(){
  if(phase!=='playing'||!run?.active||run.held)return;
  run.actions++;beep('exit');
  if(run.presses===0){finish(run.paperLeft===0?'work':'escape');return}
  if(run.presses===1&&run.paperLeft===0){finish('true');return}
  if(run.presses===1&&performance.now()-run.lastPressAt<=2000){finish('evidence');return}
  finish(chooseByPressCount());
}
function doPress(){
  if(phase!=='playing'||!run?.active||run.ended)return;
  const now=performance.now();run.presses++;run.actions++;
  run.lastPressAt=now;run.pressTimes.push(now);run.pressTimes=run.pressTimes.filter(t=>now-t<=2000);
  beep('tap');vibrate(22);shudder();renderGame();
  const button=$('redButton');button.classList.remove('bump');void button.offsetWidth;button.classList.add('bump');
  const messages={1:'ピッ。……何も起きない。多分。',2:'ウィィィン！ 時計が逆回転！',3:'社内放送「月曜日に戻ります」',4:'ちょっ、書類が浮いている！',5:'重力「お先に失礼します」',6:'上司「天井でも働けー！」',7:'社員たちが突然消え始めた！',8:'社内放送「強制退勤を実施」',9:'おい！ もうやめろって！！'};
  if(messages[run.presses])toast(messages[run.presses],run.presses>=4,1400);

function beginHold(pointerId){

function registerShake(){
  if(phase!=='playing'||!run?.active||!run.held)return;
  const now=performance.now();if(now-run.lastShakeAt<320)return;
  run.lastShakeAt=now;run.shakeCount++;

  $('buttonMessage').textContent=`スマホが揺れた！ ${Math.min(2,run.shakeCount)}/2`;
  toast(run.shakeCount===1?'ガタガタ……何かがおかしい！':'上司「まさか振ってないよな！？」',true,1200);

function onMotion(event){
  if(!motionReceived){motionReceived=true;motionStatus='ready';updateFallback()}
  if(phase!=='playing'||!run?.active||!run.held)return;
  let value=0;
  const a=event.acceleration;
  if(a&&[a.x,a.y,a.z].every(Number.isFinite)){value=Math.hypot(a.x,a.y,a.z)}
  else{
    const g=event.accelerationIncludingGravity;
    if(!g||![g.x,g.y,g.z].every(Number.isFinite))return;
    if(!gravityReady){gravity={x:g.x,y:g.y,z:g.z};gravityReady=true;return}
    gravity.x=gravity.x*.83+g.x*.17;gravity.y=gravity.y*.83+g.y*.17;gravity.z=gravity.z*.83+g.z*.17;
    value=Math.hypot(g.x-gravity.x,g.y-gravity.y,g.z-gravity.z);
  }
  const now=performance.now();
  if(value>=12&&now-lastShakeSample>=520){lastShakeSample=now;registerShake()}
}
async function requestMotion(){
  if(motionSubscribed||motionStatus==='denied'||motionStatus==='unsupported')return;
  if(typeof window.DeviceMotionEvent==='undefined'){motionStatus='unsupported';updateFallback();return}
  try{
    if(typeof DeviceMotionEvent.requestPermission==='function'){
      const permission=await DeviceMotionEvent.requestPermission();
      if(permission!=='granted'){motionStatus='denied';updateFallback();return}
    }
    if(!motionSubscribed){window.addEventListener('devicemotion',onMotion,{passive:true});motionSubscribed=true}
    motionStatus='waiting';
  }catch(e){console.info('Motion access:',e);motionStatus='denied'}
  updateFallback();
}
function updateFallback(){
  const isDesktop=!!window.matchMedia?.('(pointer:fine)').matches;

  $('fallbackShake').hidden=!fallback;
  $('shakeHint').hidden=!(run?.held&&phase==='playing'&&isDesktop);
  if(isDesktop)$('shakeHint').textContent='PC：Sキーを2回でもOK';
}
function finish(id){

  run.resultPresses=snapshot.presses+(['ceo','rocket'].includes(id)?1:0);$('endPresses').textContent=`${run.resultPresses}回`;$('endPapers').textContent=`${6-snapshot.paperLeft}枚`;

}
function confetti(){
  const layer=$('particles');layer.replaceChildren();clearTimeout(particleTimeout);
  for(let i=0;i<38;i++){
    const el=document.createElement('span');el.className='particle';
    el.style.left=`${Math.random()*100}%`;
    el.style.background=['#ffcc71','#f04d69','#92e8bd','#a5e1f1','#f6f3eb'][i%5];
    el.style.setProperty('--dx',`${(Math.random()-.5)*200}px`);
    el.style.setProperty('--dy',`${Math.random()*250+300}px`);
    el.style.setProperty('--spin',`${Math.random()*900-450}deg`);
    el.style.animationDelay=`${Math.random()*.6}s`;layer.append(el);
  }
  particleTimeout=setTimeout(()=>layer.replaceChildren(),2700);
}
function openGallery(){
  if(phase!=='ending'&&phase!=='gallery')return;
  screenBeforeGallery='screenEnd';phase='gallery';renderGallery();showScreen('screenGallery');
}
function renderGallery(){
  const grid=$('galleryGrid');grid.replaceChildren();
  for(const ending of ENDINGS){
    const unlocked=store.found.includes(ending.id);
    const card=document.createElement('article');card.className=`gallery-card${unlocked?'':' locked'}`;
    const glyph=document.createElement('div');glyph.className='glyph';glyph.textContent=unlocked?ending.emoji:'🔒';
    const idx=document.createElement('div');idx.className='idx';idx.textContent=`${ending.id==='true'?'TRUE END':ending.id==='rocket'?'SECRET END':'ENDING'} ${ending.no}`;
    const title=document.createElement('div');title.className='name';title.textContent=unlocked?ending.name:'？？？？？？';
    const hint=document.createElement('div');hint.className='hint';hint.textContent=unlocked?ending.quote:ending.hint;
    card.append(glyph,idx,title,hint);grid.append(card);
  }
  $('galleryCount').textContent=`${store.found.length} / ${TOTAL}`;
  $('galleryFill').style.width=`${100*store.found.length/TOTAL}%`;
}
function backFromGallery(){phase='ending';showScreen(screenBeforeGallery)}
function returnTitle(){stopLoop();clearDialogue();clearToast();phase='title';showScreen('screenTitle')}
function shareResult(){
  if(!run?.finalEndingId)return;
  const e=ENDINGS.find(x=>x.id===run.finalEndingId);
  const message=`『押すなって言っただろ！』\n私の残業の末路は「${e.name}」でした！${e.emoji}\n赤いボタンを${run.resultPresses??run.presses}回押してこうなった。\n#ASOBEAT #押すなって言っただろ`;
  const url=location.protocol==='https:'||location.protocol==='http:'?`${location.origin}${location.pathname}`:'';
  const target=`https://twitter.com/intent/tweet?text=${encodeURIComponent(message)}${url?'&url='+encodeURIComponent(url):''}`;
  const opened=window.open(target,'_blank','noopener,noreferrer');
  if(!opened&&navigator.clipboard)navigator.clipboard.writeText(message+(url?'\n'+url:'')).catch(()=>{});
}
function resetGallery(){
  if(!confirm('発見したエンディングをすべて削除しますか？'))return;
  store.found=[];save();renderGallery();
}

$('startBtn').addEventListener('click',()=>{beep('start');requestMotion();beginIntro()});
$('introTap').addEventListener('click',advanceDialogue);
$('paperBtn').addEventListener('click',doPaper);
$('exitBtn').addEventListener('click',doExit);
$('fallbackShake').addEventListener('click',registerShake);
$('soundBtn').addEventListener('click',()=>{soundOn=!soundOn;$('soundBtn').textContent=soundOn?'♫':'×';$('soundBtn').setAttribute('aria-label',soundOn?'効果音をオフにする':'効果音をオンにする');if(soundOn)beep('paper')});
$('replayBtn').addEventListener('click',beginIntro);
$('resultGallery').addEventListener('click',openGallery);
$('galleryBack').addEventListener('click',backFromGallery);
$('galleryReplay').addEventListener('click',beginIntro);
$('galleryReset').addEventListener('click',resetGallery);
$('endHome').addEventListener('click',returnTitle);
$('shareBtn').addEventListener('click',shareResult);
const red=$('redButton');
red.addEventListener('pointerdown',e=>{if(phase!=='playing'||(e.pointerType==='mouse'&&e.button!==0))return;e.preventDefault();beginHold(e.pointerId);try{red.setPointerCapture(e.pointerId)}catch{}});
red.addEventListener('pointerup',e=>{if(phase!=='playing'||!run?.held||run.holdPointer!==e.pointerId)return;e.preventDefault();releaseHold()});
red.addEventListener('pointercancel',cancelHold);
red.addEventListener('lostpointercapture',()=>{if(run?.held&&run.holdPointer!=='keyboard')cancelHold()});
red.addEventListener('contextmenu',e=>e.preventDefault());
document.addEventListener('keydown',e=>{
  if(phase==='intro'&&(e.code==='Space'||e.code==='Enter')){e.preventDefault();advanceDialogue();return}
  if(phase!=='playing'||!run?.active)return;
  if((e.code==='Space'||e.code==='Enter')&&document.activeElement===red&&!keyboardHold&&!e.repeat){e.preventDefault();keyboardHold=true;beginHold('keyboard')}
  else if(e.key.toLowerCase()==='s'&&!e.repeat&&run.held){e.preventDefault();registerShake()}
});
document.addEventListener('keyup',e=>{if((e.code==='Space'||e.code==='Enter')&&keyboardHold){e.preventDefault();keyboardHold=false;if(run?.held&&run.holdPointer==='keyboard')releaseHold()}});
window.addEventListener('blur',()=>{cancelHold();keyboardHold=false});
document.addEventListener('visibilitychange',()=>{lastFrameTime=performance.now();if(document.hidden){cancelHold();keyboardHold=false}});
window.addEventListener('resize',updateFallback);
if(typeof DeviceMotionEvent==='undefined')motionStatus='unsupported';
})();
</script>
</body>
